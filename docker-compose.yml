services:
  dynamodb-local:
    container_name: cardflip-dynamodb
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /data"
    volumes:
      - dynamodb-data:/data
    restart: unless-stopped
    networks:
      - cardflip-network
    healthcheck:
      # DynamoDB Local 2.x returns 400 to unauthenticated requests when healthy
      # (the /shell/ web console was removed in 2.x)
      test:
        [
          "CMD-SHELL",
          "[ \"$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000)\" = \"400\" ] || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  dynamodb-admin:
    container_name: cardflip-dynamodb-admin
    image: aaronshaf/dynamodb-admin:latest
    ports:
      - "8001:8001"
    environment:
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      dynamodb-local:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cardflip-network

volumes:
  dynamodb-data:
    name: cardflip-dynamodb-data

networks:
  cardflip-network:
    name: cardflip-network
    driver: bridge
